# Cloudflare Pages configuration for ANBU website (Next.js via @cloudflare/next-on-pages)
name = "anbu-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Environment variables are set in the Cloudflare dashboard
# (Settings → Environment variables) or via `wrangler pages secret put`.
# Needed:
#   NEXT_PUBLIC_SITE_URL   e.g. https://anbu.vn
#   RESEND_API_KEY         (optional) to email contact-form leads
#   CONTACT_TO_EMAIL       e.g. hello@anbu.vn
#   CONTACT_FROM_EMAIL     e.g. website@anbu.vn  (must be a verified Resend domain)
