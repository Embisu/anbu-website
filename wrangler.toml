# Cloudflare Pages configuration for ANBU website (Next.js via @cloudflare/next-on-pages)
name = "anbu-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Secrets (RESEND_API_KEY, GITHUB_TOKEN, NEXT_PUBLIC_SUPABASE_*, etc.) are set in the
# Cloudflare dashboard (Settings → Variables and secrets) or via `wrangler pages secret put`.
# Plain/public build variables live here in [vars] since the dashboard only accepts secrets
# once a project has a wrangler.toml.
[vars]
NEXT_PUBLIC_SITE_URL = "https://anbu.asia"
# GA4 Measurement ID (Google Analytics → Admin → Data Streams)
NEXT_PUBLIC_GA_ID = "G-QESMXR3DVS"
